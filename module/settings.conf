# ============================================================
#  ForceCloseOreUI 自动注入 —— 配置
#  WebUI（http://127.0.0.1:8899）里的开关会直接改这个文件
# ============================================================

# 目标包名（别的游戏也行，payload 只对 Minecraft 有效）
PKG=com.mojang.minecraftpe

# 1 = 开机自动注入；0 = 只在 WebUI 里点开关时才注入
AUTO_INJECT=0

# WebUI 端口
WEBUI_PORT=8899

# 注入失败重试次数
RETRY=6

# 进程起来后等 libminecraftpe.so 映射的最长秒数
WAIT_ENGINE_S=90

# 1 = 不等引擎（调试/非 Minecraft 目标时用）
SKIP_ENGINE_WAIT=0
