name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 zig（交叉到 aarch64-linux-musl）
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: 编译静态注入器 + 打模块包
        run: make package CC="zig cc -target aarch64-linux-musl"

      - name: 校验产物
        run: python3 tools/verify.py

      - uses: actions/upload-artifact@v4
        with:
          name: fcou_autoinject-module
          path: build/fcou_autoinject-v*.zip

      - name: 发 Release（只有打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/fcou_autoinject-v*.zip
          generate_release_notes: true
